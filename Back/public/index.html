<!DOCTYPE html>
<html lang="pt-BR">

<style>
#map {
    height: 100vh;
}
</style>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

    body{
        margin: 0;
    }
#map {
    height: 100vh;
}
</style>
</head>

 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

</head>
<body>

 <div id="map"></div>


<script>
    var map = L.map('map').setView([-27.23389, -52.02778], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    L.marker([-27.23389, -52.02778])
  .addTo(map)
  .bindPopup('Meu primeiro ponto no MapaJá!');
 map.on('click', function (evento) {
  const nome = prompt('Qual é o nome deste local?');

  if (!nome || !nome.trim()) {
    return;
  }

  const mensagem = document.createElement('span');
  mensagem.textContent = nome.trim();

  L.marker(evento.latlng)
    .addTo(map)
    .bindPopup(mensagem)
    .openPopup();
});
</script>
</body>
</html>
